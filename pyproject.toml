[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-network-mcp"
version = "0.1.0"
description = "MCP server for AI-assisted AWS and hybrid network troubleshooting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Harinder Singh" }
]
keywords = [
    "aws",
    "networking",
    "transit-gateway",
    "mcp",
    "troubleshooting",
    "vpc",
    "direct-connect",
    "vpn"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3-stubs[ec2,route53resolver,logs,network-firewall]>=1.34.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
aws-network-mcp = "aws_network_mcp.server:main"

[project.urls]
Homepage = "https://github.com/harindersingh/aws-network-mcp"
Repository = "https://github.com/harindersingh/aws-network-mcp"
Issues = "https://github.com/harindersingh/aws-network-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_network_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["aws_network_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
show_error_codes = true
mypy_path = "src"
exclude = [
    "examples/",
    "build/",
]

[[tool.mypy.overrides]]
module = [
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-v --cov=aws_network_mcp --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/aws_network_mcp"]
branch = true
omit = ["*/fixtures/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
