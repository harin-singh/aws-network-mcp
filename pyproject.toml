[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aws-network-mcp"
version = "0.2.0"
description = "MCP server for hybrid AWS path analysis (TGW, inspection VPC, Network Firewall, on-prem BGP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Harinder Singh" }
]
keywords = [
    "aws",
    "networking",
    "transit-gateway",
    "mcp",
    "hybrid",
    "network-firewall",
    "direct-connect",
    "vpn"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp==2.3.0",
    "boto3==1.43.123",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "mypy==1.19.1",
    "moto==5.2.5",
    "boto3-stubs[ec2,route53resolver,logs,network-firewall]==1.43.123",
    "types-pyyaml==6.0.12.20250915",
    "pip-audit==2.10.0",
    "setuptools==84.2.1",
    "pre-commit==4.7.0",
]

[project.scripts]
aws-network-mcp = "aws_network_mcp.server:main"

[project.urls]
Homepage = "https://github.com/harin-singh/aws-network-mcp"
Repository = "https://github.com/harin-singh/aws-network-mcp"
Issues = "https://github.com/harin-singh/aws-network-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_network_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["aws_network_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
mypy_path = "src"
exclude = [
    "examples/",
    "build/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-v --cov=aws_network_mcp --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/aws_network_mcp"]
branch = true
omit = ["*/fixtures/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
